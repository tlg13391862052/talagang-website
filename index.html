<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹屋特後探太都测王排品附有限公司 - 正定特後物㊂育</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght$300;400;500;700&display=swap" rel="stylesheet">
    <!--- -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+Qing+Ke+HuangYou&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin: 40px 0;
        }
        .features .feature {
            flex: 1;
            min-width: 240px;
            max-width: 280px;
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 260px;
            position: relative;
            overflow: hidden;
        }
        .features .feature::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e74c3c, #f39c12);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .features .feature:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(231, 76, 60, 0.15);
            border-color: #e74c3c;
        }
        .features .feature:hover::before { opacity: 1; }
        .features .feature i {
            font-size: 3rem;
            color: #e74c3c;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffeaea, #fff5f5);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .features .feature:hover i {
            transform: scale(1.1);
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: white;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
        }
        .features .feature h4 {
            font-size: 1.4rem;
            margin: 15px 0 10px;
            color: #2c3e50;
        }
        .features .feature p {
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
            margin: 0;
            padding: 0 10px;
        }
        @media (min-width: 1200px) {
            .features .feature { flex: 0 0 calc(25% - 25px); max-width: calc(25% - 25px); }
        }
        @media (max-width: 768px) { .features .feature { flex: 0 0 100%; max-width: 100%; min-height: 200px; } }
        @media (max-width: 992px) {
            .features { gap: 20px; }
            .features .feature { flex: 0 0 calc(50% - 20px); max-width: calc(50% - 20px); height: 240px; }
        }
      </style>
    <!-- More styles -->
    <style>
        .section { padding: 80px 0; }
        .section-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    </style>
</head>
<body>
    <h1>苹屋中无鍉鎏的欣定牙徚AZ�oyd>
</body>
</html>
